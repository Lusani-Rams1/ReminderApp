<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | CampusSync</title>
    <link rel="stylesheet" href="CSS/register.css">

</head>

<body>

    <script>
    if (localStorage.getItem('theme') === 'dark') {
      document.body.classList.add('dark');
    }
  </script>
  
<header>

    <div class="logo">
        CampusSync
    </div>

</header>

<main class="register-container">

    <div class="register-card">

        <h1>Create Account</h1>

        <p class="subtitle">
            Create your CampusSync student account
        </p>

        <div
            class="message error"
            id="errorMessage">
        </div>

        <div
            class="message success"
            id="successMessage">

            Account created successfully!

        </div>

        <form id="registerForm">

            <div class="form-group">

                <label>
                    Full Name
                </label>

                <input
                    type="text"
                    id="fullName"
                    placeholder="Enter your full name"
                    required
                >

            </div>

            <div class="form-group">

                <label>
                    Student Number
                </label>

                <input
                    type="text"
                    id="studentNumber"
                    placeholder="Enter your student number"
                    required
                >

            </div>

            <div class="form-group">

                <label>
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="student@example.com"
                    required
                >

            </div>

            <div class="form-group">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Create a password"
                    minlength="8"
                    required
                >

                <div class="password-help">
                    Password must contain at least 8 characters.
                </div>

            </div>

            <div class="form-group">

                <label>
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm your password"
                    required
                >

            </div>

            <button
                type="submit"
                class="register-btn">

                Create Account

            </button>

        </form>


        <div class="login-link">

            Already have an account?

            <a href="Login.html">
                Login
            </a>

        </div>

    </div>

</main>

<footer>

    <strong>CampusSync</strong>

    <p>
        © 2026 CampusSync. All Rights Reserved.
    </p>

</footer>

<script src="JS/register.js"></script>

</body>

</html>
