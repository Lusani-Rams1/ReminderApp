<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign Up - Smart Reminder System</title><link rel="icon" href="images/logo.png" type="image/png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="CSS/reference.css">
<link rel="stylesheet" href="CSS/portal-html.css"><script src="backend/js/student-session.js"></script></head><body class="auth-page register-page"><main class="auth-container"><div class="auth-box"><div class="auth-header"><h1>Smart Reminder System</h1><p>Create your Intuthuko College learning account</p></div><div class="error" id="errorMessage" role="alert"></div><div class="success" id="successMessage" role="status"></div><form id="registerForm" class="register-form"><div class="form-group role-select-group"><label for="registerRole">Select Role:</label><select id="registerRole" disabled><option>Student</option></select><small>Staff accounts are provided by an administrator.</small></div><div class="form-group"><label for="fullName">Username:</label><input id="fullName" type="text" placeholder="Choose a username" required ></div><div class="form-group"><label for="studentNumber">Student Number:</label><input id="studentNumber" type="text" placeholder="Enter your student number" required ></div><div class="form-group"><label for="email">Email:</label><input id="email" type="email" placeholder="Enter your email" required ></div><div class="form-group"><label for="password">Password:</label><input id="password" type="password" placeholder="Create a password" required minlength="8"></div><div class="form-group"><label for="confirmPassword">Confirm Password:</label><input id="confirmPassword" type="password" placeholder="Confirm your password" required minlength="8"></div><button type="submit" class="btn btn-primary btn-block register-btn">Create Account</button></form><p class="auth-switch">Already have an account? <a href="login.html">Sign in</a></p><p class="auth-switch"><a href="index.html">Back to home</a></p><p class="portal-demo-note">This supplied version saves accounts only in this browser. Use a demo password.</p></div></main><script src="backend/js/localData.js"></script>
<script src="backend/js/register.js"></script>
<script src="backend/js/theme.js"></script>
<script src="backend/js/portal-ui.js"></script></body></html>
