<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign In - Smart Reminder System</title><link rel="icon" href="images/logo.png" type="image/png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="CSS/reference.css">
<link rel="stylesheet" href="CSS/portal-html.css"><script src="backend/js/student-session.js"></script></head><body class="auth-page login-page"><main class="auth-container"><div class="auth-box"><div class="auth-header"><h1>Smart Reminder System</h1><p>Use your email, password, and role to access your account</p></div><div class="error" id="errorMessage" role="alert" aria-live="polite"></div><form id="loginForm" data-allowed-roles="student"><div class="form-group role-select-group"><label for="roleSelect">Sign In As:</label><select id="roleSelect" onchange="location.href=this.value"><option value="login.html" selected>Student</option><option value="tutor-login.html" >Tutor</option><option value="admin-login.html" >Admin</option><option value="super-admin-login.html" >Super Admin</option></select></div><div class="form-group"><label for="email">Email:</label><input type="email" id="email" required autocomplete="username" placeholder="Enter your email address"></div><div class="form-group"><label for="password">Password:</label><div class="password-wrapper"><input type="password" id="password" required autocomplete="current-password" placeholder="Enter your password"><button type="button" class="password-toggle" data-show-password="password" aria-label="Show password">Show</button></div></div><button class="btn btn-primary btn-block login-btn" type="submit">Sign In</button></form><p class="auth-switch">Use the same Google account as your Android app.</p><button id="googleSignIn" type="button" class="btn btn-outline btn-block" style="margin-top:12px"><i class="bi bi-google" aria-hidden="true"></i> Continue with Google</button><p class="auth-switch">New to the system? <a href="register.html">Create an account</a></p><p class="auth-switch"><a href="index.html">Back to home</a></p><p class="portal-demo-note">Email and password here are for browser demo accounts. Google sign-in opens your shared CampusSync assignments.</p></div></main><script src="backend/js/localData.js"></script>
<script src="backend/js/login.js"></script>
<script src="backend/js/theme.js"></script>
<script src="backend/js/portal-ui.js"></script></body></html>
